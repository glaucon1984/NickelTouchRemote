; NickelTouchRemote configuration.
; Copy this file to config.ini in the same folder and edit it. The file is
; read when the mod starts and again every time a Bluetooth device connects,
; so switching the remote off and on applies changes.
;
; Actions: next, prev, swap, none.
;   swap exchanges next and prev until the next swap (switch hands).

[gestures]
; How the remote's simulated finger moves for each button. The defaults
; match the WX02 ring: lower button = swipe_down, upper = swipe_up,
; middle = tap.
tap = swap
swipe_up = prev
swipe_down = next
swipe_left = none
swipe_right = none

[keys]
; Plain keys of the remote, by Linux key code, for remotes that send keys
; outside of touch contacts. Examples:
;   115 = next    ; KEY_VOLUMEUP
;   114 = prev    ; KEY_VOLUMEDOWN

[options]
; Negate next/prev while the screen is upside down (for readers that rotate).
swap_when_inverted = true
; Take touch-style remotes away from Nickel so their simulated touches cannot
; reach the screen. Leave on.
grab_touch_devices = true
; Also take every other Bluetooth input device (keyboards, button remotes).
; Only turn on when you map their keys above; Nickel then no longer sees them.
grab_other_devices = false
; keys: send the arrow keys a Bluetooth keyboard would send (works in Nickel's
;       reader and in Kobalt).
; view: call Nickel's own reading view directly, arrow keys elsewhere.
inject = keys
; Report remote presses as activity to Nickel's power manager.
power_activity = true
; Log every raw input event to the system log (see "dumplog" in doc).
verbose = false
